name: APK firmado (release)

# Se ejecuta al subir una etiqueta de versión (por ejemplo v2.0.0) o manualmente desde la pestaña Actions
# indicando la versión; en ese caso el workflow crea la etiqueta y la versión en GitHub Releases.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (por ejemplo 2.0.0)"
        required: true
        default: "2.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ETIQUETA: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Aceptar licencias del Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5

      # La llave de firma se guarda en los secrets del repositorio como texto en base64.
      - name: Recuperar la llave de firma
        env:
          RACKPRO_KEYSTORE_BASE64: ${{ secrets.RACKPRO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RACKPRO_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret RACKPRO_KEYSTORE_BASE64 (ver README, sección APK firmado)"
            exit 1
          fi
          echo "$RACKPRO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rackpro.jks"
          echo "RACKPRO_KEYSTORE_PATH=$RUNNER_TEMP/rackpro.jks" >> "$GITHUB_ENV"

      - name: Compilar APK release firmado
        env:
          RACKPRO_KEYSTORE_PASSWORD: ${{ secrets.RACKPRO_KEYSTORE_PASSWORD }}
          RACKPRO_KEY_ALIAS: ${{ secrets.RACKPRO_KEY_ALIAS }}
          RACKPRO_KEY_PASSWORD: ${{ secrets.RACKPRO_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace

      - name: Verificar la firma y renombrar el APK
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p entrega
          cp app/build/outputs/apk/release/app-release.apk "entrega/RackPro-${ETIQUETA}.apk"

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v5
        with:
          name: apk-release-firmado
          path: entrega/*.apk

      - name: Publicar la versión en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.ETIQUETA }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Rack - Pro ${{ env.ETIQUETA }}
          files: entrega/*.apk
          body: |
            APK release firmado de Rack - Pro, listo para instalar en Android 7.0 o superior.
            Descarga el archivo `.apk` de la sección **Assets**.
